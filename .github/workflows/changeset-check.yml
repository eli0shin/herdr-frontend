name: changeset check

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Every user-visible PR adds a changeset (docs/release.md). `changeset status` fails when files
  # matching .changeset/config.json's `changedFilePatterns` changed since the PR's base and no
  # changeset was added; `bunx changeset --empty` adds one that releases nothing.
  changeset:
    # The version PR consumes the changesets rather than adding one.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install --frozen-lockfile
      - name: changeset status
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bunx changeset status --since="$BASE"
