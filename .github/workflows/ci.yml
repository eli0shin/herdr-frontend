name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: docs
        run: test -f README.md && test -f AGENTS.md
      - name: toolchain
        # Installs the channel and components rust-toolchain.toml pins.
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: libghostty-vt cache
        # The pinned xcframework zip that crates/ghostty-vt-sys/build.rs downloads and verifies.
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ghostty-vt-sys
          key: ghostty-vt-${{ hashFiles('crates/ghostty-vt-sys/build.rs') }}
      - name: rune pins
        run: scripts/check-rune-pins
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --locked
      - name: ghostty-vt bindings
        # Lints the feature-gated bindgen binary, then regenerates src/bindings.rs from the pinned
        # headers and fails on a diff.
        run: |
          cargo clippy --locked -p ghostty-vt-sys --all-targets --features bindgen -- -D warnings
          cargo run --locked -p ghostty-vt-sys --features bindgen --bin ghostty-vt-bindgen -- --check
