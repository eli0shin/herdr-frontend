name: ci

on:
  push:
    branches: [main]
  pull_request:
  # version.yml starts it on the version PR's branch, whose pushes start no workflow themselves.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Standard GitHub-hosted runners, macOS included, are free on this public repository; PR CI stays
  # on Linux by choice, and the release build (release-artifacts.yml) is the only macOS job.
  # `just ci` (scripts/local-ci) runs the same steps on a Mac, where the macOS-only code and tests
  # run too.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: docs
        run: test -f README.md && test -f AGENTS.md
      - name: packages
        # Mesa's software Vulkan driver (lavapipe) for the headless Rune tests, libxkbcommon for
        # Rune's keyboard handling to link against, and libclang for the bindings check.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libxkbcommon-dev libclang-dev
      - name: toolchain
        # Installs the channel and components rust-toolchain.toml pins.
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: libghostty-vt cache
        # The pinned downloads and the Zig build of libghostty-vt that crates/ghostty-vt-sys/build.rs
        # makes and verifies.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ghostty-vt-sys
          key: ghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/ghostty-vt-sys/build.rs') }}
      - name: herdr-core
        # The pinned hc that herdr-client's tests start isolated cores with (HERDR_TEST_HC). Taken
        # straight from the release tarball, checksum-checked, never installed or started here.
        # Checksums from https://releases.herdr.dev/core/0.1.22/manifest.json.
        env:
          HC_VERSION: 0.1.22
        run: |
          case "$(uname -m)" in
            x86_64) target=linux-x86_64 sha=3054ec3992ce80c5715d721caa9dcefa6056721d15dc113f4750afce763ba5df ;;
            aarch64) target=linux-aarch64 sha=98757985245d45f8d73dd85e68b139b7f167c28488bb89edd9834c3f5a5cf4cf ;;
            *) echo "no hc build for $(uname -m)" >&2; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/herdr-core"
          mkdir -p "$dir"
          curl -fsSL "https://releases.herdr.dev/core/$HC_VERSION/herdr-core-$target.tar.gz" -o "$dir/hc.tar.gz"
          echo "$sha  $dir/hc.tar.gz" | sha256sum -c -
          tar -xzf "$dir/hc.tar.gz" -C "$dir"
          "$dir/herdr-core" --version
          echo "HERDR_TEST_HC=$dir/herdr-core" >> "$GITHUB_ENV"
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - name: justfile
        # Parses the justfile, so a broken one fails here rather than mid-run.
        run: just --list
      - name: just test
        # The same entry point used locally: rune pins, fmt, clippy, tests and the bindings check.
        run: just test
