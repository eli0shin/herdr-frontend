name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: docs
        run: test -f README.md && test -f AGENTS.md
      - name: toolchain
        # Installs the channel and components rust-toolchain.toml pins.
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: libghostty-vt cache
        # The pinned xcframework zip that crates/ghostty-vt-sys/build.rs downloads and verifies.
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ghostty-vt-sys
          key: ghostty-vt-${{ hashFiles('crates/ghostty-vt-sys/build.rs') }}
      - name: herdr-core
        # The pinned hc that herdr-client's tests start isolated cores with (HERDR_TEST_HC). Taken
        # straight from the release tarball, checksum-checked, never installed or started here.
        # Checksums from https://releases.herdr.dev/core/0.1.22/manifest.json.
        env:
          HC_VERSION: 0.1.22
        run: |
          case "$(uname -m)" in
            arm64) target=macos-aarch64 sha=90798daadefa8d126b90ef0bcdbe9c7dda9c6cfbf011a247065ab5da348f350e ;;
            x86_64) target=macos-x86_64 sha=35144041969e870ddb4edcd2fd08fd26dfe5cee7d18e6b48adb276f90a48aa19 ;;
            *) echo "no hc build for $(uname -m)" >&2; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/herdr-core"
          mkdir -p "$dir"
          curl -fsSL "https://releases.herdr.dev/core/$HC_VERSION/herdr-core-$target.tar.gz" -o "$dir/hc.tar.gz"
          echo "$sha  $dir/hc.tar.gz" | shasum -a 256 -c -
          tar -xzf "$dir/hc.tar.gz" -C "$dir"
          "$dir/herdr-core" --version
          echo "HERDR_TEST_HC=$dir/herdr-core" >> "$GITHUB_ENV"
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - name: justfile
        # Parses the justfile, so a broken one fails here rather than mid-run.
        run: just --list
      - name: just test
        # The same entry point used locally: rune pins, fmt, clippy, tests and the bindings check.
        run: just test
