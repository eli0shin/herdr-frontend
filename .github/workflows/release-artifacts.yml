name: release artifacts

# Builds and uploads a GitHub Release's artifacts. version.yml calls it right after changesets
# tags a release; run it by hand (Actions > release artifacts > Run workflow) to redo a release's.
# For now it checks the release and the tag's version; ticket 045 adds the macOS build and upload.
on:
  workflow_call:
    inputs:
      tag:
        description: The release's tag, such as v0.1.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.1.0.
        required: true
        type: string

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: release
        # The tag has a release, and the tag's tree carries the tag's version in package.json,
        # Cargo.toml and Cargo.lock, so whatever is built here reports the version it ships as.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url --jq '"\(.tagName) \(.url)"'
          test "v$(jq -r .version package.json)" = "$TAG"
          scripts/sync-version --check
          echo "Release $TAG checked. Nothing is built or uploaded yet (ticket 045)." >> "$GITHUB_STEP_SUMMARY"
