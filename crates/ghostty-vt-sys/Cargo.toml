[package]
name = "ghostty-vt-sys"
description = "libghostty-vt bindings and the link of the pinned xcframework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "ghostty-vt"

[features]
# Builds the `ghostty-vt-bindgen` binary, which regenerates `src/bindings.rs` (needs libclang).
bindgen = ["dep:bindgen"]

[dependencies]
bindgen = { version = "0.73.2", optional = true }

[build-dependencies]
sha2 = "0.11.2"

[[bin]]
name = "ghostty-vt-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]
