[package]
name = "herdr-client"
description = "herdr-core client I/O: connection, calls, attach, subscribe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
herdr-proto = { path = "../herdr-proto" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde", "std"] }
