[package]
name = "herdr-frontend"
description = "Native desktop client of herdr-core, on Rune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# MIT, but for the z2d rasterizer port, which stays MPL-2.0 (THIRD-PARTY-NOTICES.md).
license = "MIT AND MPL-2.0"
publish.workspace = true
# `cargo run` opens the app; `--bin pixel-diff` is the Ghostty comparison.
default-run = "herdr-frontend"

[dependencies]
# `terminal.put` carries a dropped file's bytes as base64. The version already in Rune's tree.
base64 = "0.22.1"
ghostty-vt-sys = { path = "../ghostty-vt-sys" }
herdr-client = { path = "../herdr-client" }
herdr-proto = { path = "../herdr-proto" }
herdr-shared = { path = "../herdr-shared" }
model = { path = "../model" }
# `tooling` keeps `--snap`, `--tree` and `--script` in release builds (debug builds always have
# them), so the installed app still draws scenes headless instead of opening a window on the core.
rune = { workspace = true, features = ["tooling"] }
serde = { version = "1.0.229", features = ["derive"] }
# The control socket's JSON (`src/control.rs`) and saved state. The version the other crates use.
serde_json = "1.0.154"
# The character map that decides which cells the primary face can draw. The version Rune's text
# stack and the terminal crate's metrics already use.
skrifa = "0.44.0"
terminal = { path = "../terminal" }
# Reads and writes the PNGs the pixel diff compares (`src/bin/pixel-diff.rs`). A version already
# in Rune's tree.
png = "0.18.1"

# The glyph atlas (`src/view/terminal/glyph/`): fallback faces, emoji and icons rasterized with the
# same CoreText calls Ghostty's macOS face makes. The versions Rune's text stack already uses.
[target.'cfg(target_os = "macos")'.dependencies]
# The window's double click on its drag rows (`src/window.rs` `no_zoom`): an in-memory
# `NSUserDefaults` default. The versions Rune's macOS platform code already uses.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSObject", "NSString", "NSUserDefaults"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCharacterSet", "CFData", "CFDictionary", "CFNumber", "CFString", "CFCGTypes", "CFURL"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGContext", "CGColorSpace", "CGImage", "CGFont"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontCollection", "CTFontDescriptor", "CTFontManager", "CTFontTraits", "objc2-core-graphics"] }

# The end-to-end harness (`docs/e2e.md`): real windows on the person's display, so it runs only
# under `just e2e` (`HERDR_E2E=1`); plain `cargo test` builds it and skips.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false

# Input-to-frame latency on this Mac (`docs/latency.md`): a real window on the person's display, so
# it runs only under `just latency` (`HERDR_LATENCY=1`); plain `cargo test` builds it and skips.
[[test]]
name = "latency"
path = "tests/latency/main.rs"
harness = false
