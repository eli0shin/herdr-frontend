[workspace]
resolver = "3"
members = [
    "crates/ghostty-vt-sys",
    "crates/herdr-proto",
    "crates/herdr-client",
    "crates/herdr-shared",
    "crates/terminal",
    "crates/model",
    "crates/app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
publish = false

# Rune is pinned to one `dev` rev. Every Rune line here and in [patch.crates-io] uses the same URL
# and rev; to bump, follow docs/research/rune.md §1 and run `just check-pins`.
[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }

# Rune's own [patch.crates-io] list at the pinned rev. Cargo does not inherit patches from a
# dependency, so the workspace root repeats it, at the same URL and rev as `rune`.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
naga = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }

# opencode-rune's dev profile: dependencies at opt-level 1, and the crates that shape text, paint and
# decode every frame at opt-level 3, so debug runs don't stutter.
[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.dev.package.rune]
opt-level = 3
[profile.dev.package.rune-text]
opt-level = 3
[profile.dev.package.rune-image]
opt-level = 3
[profile.dev.package.parley_engine]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3

# What `just bundle` and `just install` ship: opencode-rune's release profile, the whole program
# optimised as one (fat LTO, one codegen unit). Against Cargo's default it builds slower (5 m 52 s
# cold and 2 m 17 s after an app-crate edit, against 1 m 53 s and 7 s) for a smaller binary and
# 10-15% less UI time a frame on `just pane-budget`'s heavy loads (docs/research/rune.md §1).
# Symbols stay (Cargo strips only debug info), so a panic's backtrace still names functions.
[profile.release]
lto = "fat"
codegen-units = 1
incremental = false
